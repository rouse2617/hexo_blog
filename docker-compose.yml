# AI-Ops Docker Compose 配置
# 用于快速部署和开发

services:
  ai-pro:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-pro:latest
    container_name: ai-pro
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 挂载数据目录（持久化）
      - ./data:/app/data
      # 挂载配置文件（可选，用于自定义配置）
      - ./config.yaml:/app/config.yaml:ro
      # 挂载脚本目录（可选）
      - ./scripts:/app/scripts:ro
    environment:
      # 时区设置
      - TZ=Asia/Shanghai
      # API 配置
      - API_HOST=0.0.0.0
      - API_PORT=8080
      # 数据库配置
      - DB_PATH=/app/data/aiops.db
    networks:
      - ai-pro-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 可选：Nginx 反向代理
  # nginx:
  #   image: nginx:alpine
  #   container_name: ai-pro-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - ai-pro
  #   networks:
  #     - ai-pro-network

networks:
  ai-pro-network:
    driver: bridge

volumes:
  ai-pro-data:
    driver: local
