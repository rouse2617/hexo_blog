name: check_redis
description: 检查 Redis 服务状态
path: scripts/check_redis.sh
timeout: 30
enabled: true
params:
  - name: host
    type: string
    description: Redis 主机地址
    required: false
    default: "localhost"
  - name: port
    type: integer
    description: Redis 端口
    required: false
    default: 6379
