# OpsGenius Backend Configuration Example
# Copy this file to config.yaml and update the values

server:
  host: "0.0.0.0"
  port: 8080
  websocket_path: "/ws"
  tls:
    enabled: false
    cert_file: "/path/to/cert.pem"
    key_file: "/path/to/key.pem"

llm:
  provider: "openai"  # openai, anthropic, azure
  api_key: "${LLM_API_KEY}"
  model: "gpt-4"
  temperature: 0.7
  max_tokens: 2000

mcp_servers:
  - id: "log-mcp"
    name: "Log MCP Server"
    transport: "stdio"
    command: "python"
    args: ["-m", "log_mcp_server"]
    env:
      LOG_PATH: "/var/log"
  
  - id: "metric-mcp"
    name: "Metric MCP Server"
    transport: "http"
    url: "http://localhost:9090/mcp"
    auth:
      type: "bearer"
      token: "${METRIC_MCP_TOKEN}"
  
  - id: "k8s-mcp"
    name: "Kubernetes MCP Server"
    transport: "stdio"
    command: "k8s-mcp-server"
    args: ["--kubeconfig", "/path/to/kubeconfig"]

database:
  host: "localhost"
  port: 5432
  database: "opsgenius"
  user: "postgres"
  password: "${DB_PASSWORD}"
  max_connections: 100

redis:
  host: "localhost"
  port: 6379
  password: "${REDIS_PASSWORD}"
  db: 0
  pool_size: 50

security:
  auth_enabled: true
  jwt_secret: "${JWT_SECRET}"
  allowed_origins: ["http://localhost:3000", "https://app.opsgenius.io"]

logging:
  level: "info"  # debug, info, warn, error
  format: "json"
  output: "stdout"
