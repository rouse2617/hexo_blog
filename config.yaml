# AI-Ops 配置文件

server:
  addr: ":8080"
  mode: debug  # debug / release
 
 
llm:
  endpoint: "https://alex-ewoeo-bigeowifo.hf.space/api/coding/paas/v4"
  model: "glm-4.7"
  timeout: 120s
  max_tokens: 4096
  api_key: "A6uYVA1EosYnHrl0lT1r2u2IuEh1AHzAzn-knWY-Dws"

ssh:
  default_timeout: 30s
  connect_timeout: 10s
  max_connections: 100
  max_concurrent: 20
  keepalive_interval: 30s
  default_user: root
  default_key_path: ~/.ssh/id_rsa

# 预定义主机列表
# 如果当前节点可以 SSH 到其他节点，只需配置 IP 即可（使用默认用户和密钥）
hosts:
  # 示例：使用默认密钥认证（最简配置，只需 name 和 host）
  # - name: node1
  #   host: 192.168.1.10
  #
  # 示例：指定用户和端口
  - name: 192.168.136.129
    host: 192.168.136.129
    port: 22
    auth_type: password
    user: hrp
    password: "hrp"
  #
  # 示例：使用密码认证
  - name: rui.vin
    host: rui.vin 
    user: root
    auth_type: password
    password: "Hrp5490295"
  

database:
  driver: sqlite
  dsn: ./data/aiops.db

scripts:
  dir: ./scripts

agent:
  max_loops: 10

log:
  level: info    # debug / info / warn / error
  format: json   # json / text
  output: stdout # stdout / 文件路径
